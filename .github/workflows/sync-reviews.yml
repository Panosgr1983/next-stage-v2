name: Sync Google Reviews

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync latest reviews
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: node scripts/sync-reviews.mjs
      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/i18n/locales/el.ts src/i18n/locales/en.ts
            git commit -m "chore: sync latest Google reviews"
            git push
          else
            echo "No changes"
          fi
